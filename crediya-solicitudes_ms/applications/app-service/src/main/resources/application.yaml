server:
  port: 8081
spring:
  application:
    name: crediya-solicitudes
  devtools:
    add-properties: false
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/crediya_solicitudes}"
    username: "${DB_USERNAME:crediya_user}"
    password: "${DB_PASSWORD:crediya_pass}"
    driver-class-name: org.postgresql.Driver
    driverClassName: org.postgresql.Driver
  jpa:
    databasePlatform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"